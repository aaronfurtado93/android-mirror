name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests && ruff format --check src tests
      - run: pytest
      - name: CLI smoke test
        run: |
          android-mirror --version
          android-mirror paths
          android-mirror doctor || true   # adb/scrcpy are not installed on runners

  package:
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make dist
      - name: Install the release bundle into a throwaway HOME
        run: |
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          tar -xzf dist/android-mirror-*.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP"/android-mirror-*/install.sh --yes --no-deps
          "$HOME/.local/bin/android-mirror" doctor || true
          curl -fsS http://127.0.0.1:8765/api/version
          "$HOME/.local/bin/android-mirror" uninstall --yes --purge
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: release-bundle
          path: |
            dist/*.tar.gz
            dist/*.whl
